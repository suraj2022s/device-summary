name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.20"

jobs:
  quality:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag device-summary .
      - name: Start container
        run: docker run --detach --name api --publish 8000:8000 device-summary
      - name: Check /summary returns the sample result
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/summary | tee summary.json
          python3 - <<'EOF'
          import json

          summary = json.load(open("summary.json"))
          assert summary["accepted"] == 3, summary
          assert summary["duplicates"] == 1, summary
          assert [error["line"] for error in summary["errors"]] == [4], summary
          assert [device["device_id"] for device in summary["devices"]] == ["D01", "D02"], summary
          print("Docker smoke test passed")
          EOF
      - name: Container logs
        if: always()
        run: docker logs api
