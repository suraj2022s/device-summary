[project]
name = "device-summary"
version = "1.0.0"
description = "Summarise a JSON Lines file of simulated device messages and serve the result over HTTP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.35",
]

[project.scripts]
device-summary = "device_summary.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "hypothesis>=6.160",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device_summary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=device_summary",
    "--cov-branch",
    "--cov-report=term-missing",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT"]
ignore = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
